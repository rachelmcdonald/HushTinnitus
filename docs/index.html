<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hush Tinnitus</title>
<meta name="description" content="Hush Tinnitus — sound therapy and self-management support for tinnitus, by RESONEAR.">
<style>
  :root {
    --deep-tide: #0D4F5C;
    --calm-wave: #5DCAA5;
    --warm-sand: #F5F1EB;
    --text-muted: #4C6165;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--warm-sand);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1A2B2B;
  }

  .hero {
    background: var(--deep-tide);
    padding: 80px 24px 96px;
    text-align: center;
  }

  .hero svg {
    display: block;
    margin: 0 auto 20px;
  }

  .hero .wordmark {
    font-size: 40px;
    font-weight: 400;
    color: var(--calm-wave);
    letter-spacing: -0.02em;
    margin: 0;
  }

  .hero .wordmark .dot {
    color: var(--warm-sand);
  }

  .hero .tagline {
    color: rgba(245, 241, 235, 0.8);
    font-size: 16px;
    margin: 10px 0 0;
  }

  main {
    max-width: 640px;
    margin: -48px auto 0;
    padding: 0 24px 64px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 12px 32px rgba(13, 79, 92, 0.12);
    text-align: center;
  }

  .card p {
    font-size: 16px;
    line-height: 1.6;
    color: #1A2B2B;
    margin: 0 0 24px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .btn {
    display: inline-block;
    width: 100%;
    max-width: 320px;
    padding: 14px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
  }

  .btn-primary {
    background: var(--deep-tide);
    color: var(--warm-sand);
  }

  .btn-primary:hover {
    background: #0a3d47;
  }

  footer {
    text-align: center;
    padding: 32px 24px 56px;
    font-size: 13px;
    color: var(--text-muted);
  }

  footer a {
    color: var(--text-muted);
  }
</style>
</head>
<body>

  <div class="hero">
    <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <ellipse cx="24" cy="40" rx="18" ry="5.5" stroke="#5DCAA5" stroke-width="2" opacity="0.3"/>
      <ellipse cx="24" cy="40" rx="12" ry="3.5" stroke="#5DCAA5" stroke-width="2.2" opacity="0.55"/>
      <ellipse cx="24" cy="40" rx="6" ry="2" stroke="#5DCAA5" stroke-width="2.5" opacity="0.9"/>
      <circle cx="24" cy="30" r="4" fill="#5DCAA5"/>
      <circle cx="24" cy="20" r="3" fill="#5DCAA5" opacity="0.75"/>
      <circle cx="24" cy="12" r="2" fill="#5DCAA5" opacity="0.5"/>
    </svg>
    <p class="wordmark">hush<span class="dot">.</span></p>
    <p class="tagline">Sound therapy &amp; support</p>
  </div>

  <main>
    <div class="card">
      <p>
        Hush Tinnitus is a self-management companion app for people living
        with tinnitus — sound therapy, guided relaxation, and symptom
        tracking, all kept private on your own device.
      </p>
      <div class="links">
        <a class="btn btn-primary" href="./privacy-policy.html">Privacy Policy</a>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 RESONEAR</p>
  </footer>

</body>
</html>
